name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check out MailAtlas core
        uses: actions/checkout@v5
        with:
          repository: mailatlas/mailatlas
          path: .ci/mailatlas-core
      - name: Check out sample data
        uses: actions/checkout@v5
        with:
          repository: mailatlas/sample-data
          path: .ci/sample-data
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install local MailAtlas and example dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./.ci/mailatlas-core
          python -m pip install fastapi uvicorn python-dotenv
      - name: Check shell scripts
        run: |
          bash -n cli-ingest/demo_cli.sh
          bash -n python-api/demo_parser_api.sh
          bash -n gmail-oauth-send/demo_gmail_oauth_send.sh
      - name: Run non-live examples
        env:
          MAILATLAS_SAMPLE_DATA_DIR: ${{ github.workspace }}/.ci/sample-data
          MAILATLAS_SKIP_PDF: "1"
        run: |
          ./cli-ingest/demo_cli.sh
          ./python-api/demo_parser_api.sh
          python -m unittest discover -s fastapi-demo -p "test_*.py" -v
      - name: Compile Python files
        run: python -m compileall -q fastapi-demo
